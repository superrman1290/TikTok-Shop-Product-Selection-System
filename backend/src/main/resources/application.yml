spring:
  application:
    name: tiktok-product-insight
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tiktok_insight?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${MYSQL_USER:tiktok_user}
    password: ${MYSQL_PASSWORD:change_me}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      validation-timeout: 2000
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:change_me}
      timeout: 2s
  flyway:
    enabled: true
    locations: filesystem:${DATABASE_MIGRATIONS_PATH:../database/migrations}
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

server:
  port: ${BACKEND_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    stage: analysis
    version: '@project.version@'

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  analysis:
    active-version: ${ANALYSIS_ACTIVE_VERSION:selection-v1.0}
    worker-delay-ms: ${ANALYSIS_IMPORT_WORKER_DELAY_MS:10000}
    daily-cron: ${ANALYSIS_DAILY_CRON:0 30 1 * * *}
  alert:
    daily-cron: ${ALERT_DAILY_CRON:0 0 2 * * *}
  storage:
    path: ${LOCAL_STORAGE_PATH:../data/uploads}
  auth:
    issuer: tiktok-product-insight
    access-token-ttl: 2h
    refresh-token-ttl: 30d
    access-secret: ${JWT_ACCESS_SECRET}
    refresh-secret: ${JWT_REFRESH_SECRET}
    refresh-cookie-secure: ${AUTH_COOKIE_SECURE:false}
    initial-admin:
      email: ${INITIAL_ADMIN_EMAIL:}
      username: ${INITIAL_ADMIN_USERNAME:}
      password: ${INITIAL_ADMIN_PASSWORD:}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level requestId=%X{requestId:-none} module=%logger{36} event=application_log message=%msg%n"
