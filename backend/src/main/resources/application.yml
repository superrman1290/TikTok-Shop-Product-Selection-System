spring:
  application:
    name: tiktok-product-insight
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tiktok_insight?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${MYSQL_USER:tiktok_user}
    password: ${MYSQL_PASSWORD:change_me}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      validation-timeout: 2000
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:change_me}
      timeout: 2s
  flyway:
    enabled: true
    locations: filesystem:${DATABASE_MIGRATIONS_PATH:../database/migrations}
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

server:
  port: ${BACKEND_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    stage: foundation
    version: '@project.version@'

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  storage:
    path: ${LOCAL_STORAGE_PATH:../data/uploads}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level requestId=%X{requestId:-none} module=%logger{36} event=application_log message=%msg%n"
